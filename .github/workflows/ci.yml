name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install backend deps
        run: |
          cd backend
          npm ci || npm i
      - name: Backend sanity check
        run: |
          node -e "require('fs').accessSync('backend/src/server.js)"
        shell: bash
      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('backend/package.json','utf8'))"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install frontend deps
        run: |
          cd frontend
          npm ci || npm i
      - name: Build frontend
        run: |
          cd frontend
          npm run build --if-present
